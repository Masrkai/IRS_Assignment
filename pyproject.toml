[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aie425-irs-assignment"
version = "0.1.0"
description = "AIE425 Intelligent Recommender Systems Assignment 1"
requires-python = ">=3.13"
dependencies = [
  "polars>=1.20",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
